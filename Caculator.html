<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    section {
      margin-top: 50px;
      box-sizing: border-box;
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .calculator {
      background-color: #000;
      width: 375px;
      height: 700px;
      border-radius: 40px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 20px 40px rgb(0, 0, 0, 0.4);
    }

    .display {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 10px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .expression {
      color: #8a8a8f;
      font-size: 24px;
      min-height: 28px;
      margin-bottom: 5px;
      word-wrap: break-word;
      word-break: break-all;
      text-align: right;
    }
    .result {
      color: #fff;
      font-size: 64px;
      font-weight: 400;
      line-height: 1;
      word-wrap: break-word;
      word-break: break-all;
      text-align: right;
    }

    .buttuns-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      border: none;
      outline: none;
      height: 76px;
      border-radius: 50px;
      font-size: 30px;
      font-weight: 400;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 1s ease;
    }

    .btn:active {
      opacity: 0.7;
    }

    .btn-dark-gray {
      background-color: #1c1c1e;
      color: #fff;
    }

    .btn-light-gray {
      background-color: #48484a;
      color: #fff;
      font-size: 26px;
    }

    .btn-orange {
      background-color: #ff9f0a;
      color: #fff;
      font-size: 34px;
    }

    .btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }
  </style>
  <body>
    <section>
      <div class="calculator">
        <div class="display">
          <div class="expression"></div>
          <div class="result">0</div>
        </div>
        <div class="buttuns-grid">
          <button class="btn btn-light-gray">
            <svg viewBox="0 0 24 24">
              <path
                d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"
              />
            </svg>
          </button>

          <button class="btn btn-light-gray">AC</button>
          <button class="btn btn-light-gray">%</button>
          <button class="btn btn-orange">÷</button>

          <button class="btn btn-dark-gray">7</button>
          <button class="btn btn-dark-gray">8</button>
          <button class="btn btn-dark-gray">9</button>
          <button class="btn btn-orange">x</button>

          <button class="btn btn-dark-gray">4</button>
          <button class="btn btn-dark-gray">5</button>
          <button class="btn btn-dark-gray">6</button>
          <button class="btn btn-orange">-</button>

          <button class="btn btn-dark-gray">1</button>
          <button class="btn btn-dark-gray">3</button>
          <button class="btn btn-dark-gray">3</button>
          <button class="btn btn-orange">+</button>

          <button class="btn btn-dark-gray">+/</button>
          <button class="btn btn-dark-gray">0</button>
          <button class="btn btn-dark-gray">.</button>
          <button class="btn btn-orange">=</button>
        </div>
      </div>
    </section>

    <script>
      let num1 = document.getElementById("num1");
      let num2 = document.getElementById("num2");
      let result = document.getElementById("result");

      document
        .getElementById("subtract")
        .addEventListener("click", function () {
          let number1 = Number(num1.value);
          let number2 = Number(num2.value);
          result.textContent = number1 - number2;
        });

      document.getElementById("add").addEventListener("click", function () {
        let number1 = Number(num1.value);
        let number2 = Number(num2.value);
        result.textContent = number1 + number2;
      });

      document.getElementById("divid").addEventListener("click", function () {
        let number1 = Number(num1.value);
        let number2 = Number(num2.value);
        result.textContent = number1 / number2;
      });

      document
        .getElementById("multiply")
        .addEventListener("click", function () {
          let number1 = Number(num1.value);
          let number2 = Number(num2.value);
          result.textContent = number1 * number2;
        });

      let age = document.getElementById("age");
      let result1 = document.getElementById("result");
      document.getElementById("check").addEventListener("click", function () {
        let userAge = Number(age.value);
        if (userAge >= 18) {
          result.textContent = "You are an audlt";
        } else {
          result.textContent = "You are not an adult";
        }
      });
    </script>
  </body>
</html>
